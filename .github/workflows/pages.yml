# Deploys every branch to Cloudflare Pages as its own preview (branch name = preview alias);
# the production branch deploys to production. Direct-upload flow, so no GitHub App is needed.
# Required repository secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun run build
      - name: Cloudflare secrets missing
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: echo "::notice::Deploy skipped. Add CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable per-branch Pages previews."
      # Genuinely idempotent (ruling 147): ask whether the project exists before creating it,
      # and treat "already exists" (code 8000002) as the steady state rather than an error.
      # A step that is red on every run teaches us to stop reading red.
      - name: Ensure the Pages project exists
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        env:
          PROJECT: dna-web-application
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT" \
            || echo 000)
          if [ "$code" = "200" ]; then
            echo "Pages project $PROJECT already exists; nothing to create."
            exit 0
          fi
          if [ "$code" != "404" ]; then
            echo "::notice::Could not read the Pages project (HTTP $code). Trying create and tolerating 'already exists'."
          fi
          # Hold wrangler's output back so a tolerated "already exists" never prints as an error.
          out=$(bunx wrangler pages project create "$PROJECT" --production-branch=main 2>&1) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Created Pages project $PROJECT."
            exit 0
          fi
          if printf '%s\n' "$out" | grep -qE '8000002|already exists'; then
            echo "Pages project $PROJECT already exists; nothing to create."
            exit 0
          fi
          printf '%s\n' "$out"
          exit "$status"
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dna-web-application --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true

  # Exit check (ruling 61): the responsive matrix against the deployed preview, Chromium and WebKit.
  matrix:
    needs: deploy
    if: ${{ needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: ${{ needs.deploy.outputs.url || format('https://{0}.dna-web-application.pages.dev', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Live check (deployed HTML serves the app)
        run: |
          set -e
          echo "Testing $BASE"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/sign-in.html -w '%{http_code}' "$BASE/sign-in" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "GET /sign-in -> $code"
          test "$code" = "200"
          grep -q '<title>DNA</title>' /tmp/sign-in.html
          grep -q 'manifest.webmanifest' /tmp/sign-in.html
          # tests/live-checks.cjs asserts /connect (ruling 156) in a single GET with no retry,
          # seconds after a fresh direct-upload deployment. Run 86 returned 404 there and took
          # the whole matrix with it while every REST assertion passed. Poll it the way
          # /sign-in is polled, so the suite runs against a deployment that has propagated.
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/connect.html -w '%{http_code}' "$BASE/connect" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "GET /connect -> $code"
          test "$code" = "200"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/strand/adinkra/mate-masie.svg")
          echo "GET /strand/adinkra/mate-masie.svg -> $code"
          test "$code" = "200"
          # Ruling 184's asset contract: every path in the table serves from the deployment, so the
          # redesign is a file overwrite. favicon.ico is absent by the founder's own 9 September
          # edit and is deliberately not checked here.
          for p in /strand/logo.png /favicon.png /apple-touch-icon.png /icon-192.png /icon-512.png; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$p")
            echo "GET $p -> $code"
            test "$code" = "200"
          done
          # The manifest's icons must resolve, or an install produces an iconless app.
          curl -sS "$BASE/manifest.webmanifest" -o /tmp/manifest.json
          grep -q '/icon-192.png' /tmp/manifest.json
          grep -q '/icon-512.png' /tmp/manifest.json
          ! grep -q 'mate-masie' /tmp/manifest.json
      - name: Brief 3 live checks (served HTML and the anonymous REST surface)
        run: node tests/live-checks.cjs
      # The runner image ships a Google Chrome apt source the matrix never reads: browsers come
      # from Playwright. On 9 September its Packages index served a hash sum mismatch, apt-get
      # update inside --with-deps exited 100, and the matrix never started. Drop the source.
      - name: Drop the unused Google Chrome apt source
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
      - name: Install browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Run matrix (Chromium and WebKit)
        env:
          WEBKIT: "1"
          OUT: ${{ github.workspace }}/matrix-out
        run: node tests/matrix.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-run-${{ github.run_number }}
          path: matrix-out
          if-no-files-found: warn
