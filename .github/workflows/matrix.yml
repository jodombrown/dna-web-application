# Responsive test matrix (ruling 61) against a deployed Pages URL, in Chromium and WebKit.
# Dispatch it for a branch; base_url defaults to that branch's Pages preview alias.
name: Responsive matrix

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed URL to test (defaults to the branch's Pages preview)
        required: false
        default: ""
      special:
        description: Run flows only (publish, keyboard, silence, shell, targeted, profile, connect, vocab, block)
        required: false
        default: ""
      only:
        description: One viewport as JSON, e.g. [1280,800]
        required: false
        default: ""
      theme:
        description: One theme (light or dark)
        required: false
        default: ""
      probe:
        description: Ruling 200 diagnostic; appearance or color-scheme. Empty runs the control.
        required: false
        default: ""

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Resolve target URL and artifact slug
        id: target
        env:
          BASE_URL: ${{ inputs.base_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          URL="$BASE_URL"
          if [ -z "$URL" ]; then URL="https://${REF_NAME}.dna-web-application.pages.dev"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # upload-artifact rejects " : < > | * ? \ / CR LF in a name, and our branch names
          # carry a slash. Map every rejected character, for any branch shape, not just that one.
          SLUG=$(printf '%s' "$REF_NAME" | tr -d '\r\n' | tr '"/:<>|*?\\' '-')
          [ -n "$SLUG" ] || SLUG="ref"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Testing $URL (artifact slug $SLUG)"
      - name: Live check (deployed HTML serves the app)
        run: |
          set -e
          URL="${{ steps.target.outputs.url }}"
          code=$(curl -sS -o /tmp/sign-in.html -w '%{http_code}' "$URL/sign-in")
          echo "GET /sign-in -> $code"
          test "$code" = "200"
          grep -q '<title>DNA</title>' /tmp/sign-in.html
          grep -q 'manifest.webmanifest' /tmp/sign-in.html
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/strand/adinkra/mate-masie.svg")
          echo "GET /strand/adinkra/mate-masie.svg -> $code"
          test "$code" = "200"
      - name: Install browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Run matrix (Chromium and WebKit)
        env:
          BASE: ${{ steps.target.outputs.url }}
          WEBKIT: "1"
          OUT: ${{ github.workspace }}/matrix-out
          # Empty is falsy in tests/matrix.cjs, so an unset input runs the whole matrix.
          SPECIAL: ${{ inputs.special }}
          ONLY: ${{ inputs.only }}
          THEME: ${{ inputs.theme }}
          RULING200_PROBE: ${{ inputs.probe }}
        run: node tests/matrix.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ steps.target.outputs.slug }}-${{ github.run_number }}
          path: matrix-out
          if-no-files-found: warn
