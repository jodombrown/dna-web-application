# Responsive test matrix (ruling 61) against a deployed Pages URL, in Chromium and WebKit.
# Dispatch it for a branch; base_url defaults to that branch's Pages preview alias.
#
# The default only resolves for a branch whose name is already a valid host label. Cloudflare
# slugifies an alias, so a branch carrying a slash needs base_url passed explicitly; the deployment
# check names the URL it tried, so the failure says so rather than looking like a dead deployment.
name: Responsive matrix

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed URL to test (defaults to the branch's Pages preview)
        required: false
        default: ""
      engine:
        description: One engine (chromium or webkit). Empty runs both in this one job.
        required: false
        default: ""
      special:
        description: Run flows only (publish, keyboard, silence, shell, width, targeted, profile, connect, event, discovery, vocab, block, auth, onboarding)
        required: false
        default: ""
      only:
        description: One viewport as JSON, e.g. [1280,800]
        required: false
        default: ""
      theme:
        description: One theme (light or dark)
        required: false
        default: ""
      expect:
        description: Ruling 292; set to "write" to regenerate tests/expected-counts.json from this run instead of enforcing it.
        required: false
        default: ""
      dump_labels:
        description: Ruling 292; set to "1" to print every check label as it is emitted, so a changed count can be named rather than only counted.
        required: false
        default: ""
      probe:
        description: Ruling 200 diagnostic; compositing, appearance or color-scheme. Empty runs the control.
        required: false
        default: ""
      loop:
        description: Ruling 200; iterations of the owner-flow crash loop instead of the matrix. Empty runs the matrix.
        required: false
        default: ""
      onboard:
        description: Brief 5, Done Means 8; set to "1" to onboard the two ruling 218 test accounts through the deployed surface instead of running the matrix. Idempotent.
        required: false
        default: ""
      dia_latency:
        description: Ruling 74; set to "1" to measure the composer's Anthropic call against the deployed function instead of running the matrix. Measures only.
        required: false
        default: ""
      sample:
        description: Ruling 74; how many sequential calls the latency arm makes. Empty is 80.
        required: false
        default: ""

jobs:
  # Brief 5, Done Means 8: the two ruling 218 test accounts complete onboarding once, through the
  # real surface on the deployment, with the same secrets the live arms use. Lives in this workflow
  # rather than its own because a workflow file is dispatchable only once it is on main.
  onboard:
    if: ${{ inputs.onboard == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ inputs.base_url || format('https://{0}.dna-web-application.pages.dev', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: scripts/retry.sh 3 bun install --frozen-lockfile
      - name: The deployment serves every path the suites open (ruling 217)
        run: scripts/deployment-serves.sh
      - name: Install Chromium
        run: scripts/retry.sh 3 bunx playwright install --with-deps chromium
      - name: Onboard Owner Test and Member Test through the surface
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          MEMBER_EMAIL: ${{ secrets.MEMBER_EMAIL }}
          MEMBER_PASSWORD: ${{ secrets.MEMBER_PASSWORD }}
        run: node tests/onboard-test-accounts.cjs
  # Ruling 74's proof, dispatch only. Convene Pass 1 owes a measured composer latency under 62, and
  # the estimate it must not rest on (1,794ms) is another model on another provider. A runner is the
  # only place that can produce the number: it has egress to the deployed function and the ruling 218
  # credentials the function's verify_jwt requires. The arm makes N sequential calls with a member's
  # own JWT, the way the composer fires one inference per debounce, and prints p50 and p95 for the
  # function's own latency_ms and for client wall time. It changes nothing, asserts nothing and gates
  # nothing, so it never runs on a push and an over-budget percentile is a number rather than a red
  # check: moving the budget is a ruling, not an arm's decision.
  dia-latency:
    if: ${{ inputs.dia_latency == '1' || inputs.special == 'dia-latency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the deployment whose endpoint is measured
        id: target
        env:
          BASE_URL: ${{ inputs.base_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          URL="$BASE_URL"
          if [ -z "$URL" ]; then URL="https://${REF_NAME}.dna-web-application.pages.dev"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Reading the endpoint out of the deployment at $URL, then measuring it"
      - name: Measure the composer's Anthropic call (ruling 74)
        env:
          BASE: ${{ steps.target.outputs.url }}
          # Ruling 218's seeded accounts. The function verifies the JWT, so without these the arm
          # reports unproven (ruling 228) rather than measuring nothing and passing.
          MEMBER_EMAIL: ${{ secrets.MEMBER_EMAIL }}
          MEMBER_PASSWORD: ${{ secrets.MEMBER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          N: ${{ inputs.sample }}
          OUT: ${{ github.workspace }}/dia-out
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          node tests/dia-latency.cjs 2>&1 | tee "$OUT/dia-latency.log"
      - name: The numbers, in the tail and the job summary (ruling 267)
        if: always()
        env:
          OUT: ${{ github.workspace }}/dia-out
        run: |
          set -uo pipefail
          log="$OUT/dia-latency.log"
          if [ ! -s "$log" ]; then
            echo "The measurement step produced no output; it did not reach tests/dia-latency.cjs."
            exit 0
          fi
          tail=$(sed -n '/=== REPORT (ruling 74)/,$p' "$log")
          [ -n "$tail" ] || tail=$(tail -40 "$log")
          echo "=== ruling 74: the measured numbers, re-emitted ==="
          printf '%s\n' "$tail"
          {
            echo "### Ruling 74: the composer's Anthropic call, measured"
            echo '```'
            printf '%s\n' "$tail"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the per-call record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dia-latency-${{ github.run_number }}
          path: dia-out
          if-no-files-found: warn

  matrix:
    if: ${{ inputs.onboard == '' && inputs.dia_latency != '1' && inputs.special != 'dia-latency' }}
    runs-on: ubuntu-latest
    # 60, not 45 (handoff 31-B): Brief 9's Discovery arm adds twenty arms per engine, about six
    # minutes, and run 316 put Chromium's whole matrix past 45 at +2682s with no check failed.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Ruling 217: the registry is a third party this job does not test.
      - run: scripts/retry.sh 3 bun install --frozen-lockfile
      - name: Resolve target URL and artifact slug
        id: target
        env:
          BASE_URL: ${{ inputs.base_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          URL="$BASE_URL"
          if [ -z "$URL" ]; then URL="https://${REF_NAME}.dna-web-application.pages.dev"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # upload-artifact rejects " : < > | * ? \ / CR LF in a name, and our branch names
          # carry a slash. Map every rejected character, for any branch shape, not just that one.
          SLUG=$(printf '%s' "$REF_NAME" | tr -d '\r\n' | tr '"/:<>|*?\\' '-')
          [ -n "$SLUG" ] || SLUG="ref"
          ENGINES="${{ inputs.engine }}"
          [ -n "$ENGINES" ] || ENGINES="chromium webkit"
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Testing $URL in $ENGINES (artifact slug $SLUG)"
      # Ruling 485, Design pass 01 B14 item 3: every token a surface cites resolves in both themes.
      # Static, so it runs before the deployment is even reached and names the file that cites the
      # token rather than leaving an unstyled value to be spotted in a screenshot.
      - name: Every cited token resolves in both themes (ruling 485)
        run: node scripts/token-check.mjs
      - name: The deployment serves every path the suites open (ruling 217)
        env:
          BASE: ${{ steps.target.outputs.url }}
        run: scripts/deployment-serves.sh
      # Ruling 217: cdn.playwright.dev and apt are third parties this gate does not test, and a
      # failure here ends the matrix before a test body runs.
      - name: Install browsers
        run: scripts/retry.sh 3 bunx playwright install --with-deps ${{ steps.target.outputs.engines }}
      # Ruling 200: a dispatched run reproduces the web-process crash but, without this, records
      # only that it happened. Core dumps cost nothing on a passing run and are the only route to
      # the signal and stack the investigation still lacks. Diagnostic only; no pass criterion.
      - name: Enable core dumps
        run: |
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern='/tmp/cores/core.%e.%p.sig%s' || true
          sudo sysctl -w kernel.core_uses_pid=0 || true
          sudo sysctl -w fs.suid_dumpable=1 || true
          cat /proc/sys/kernel/core_pattern
      # Ruling 200: the crash lands about once in six full profile runs, so waiting for one is a poor
      # use of a runner. tests/webkit-crash-loop.cjs drives tests/profile.cjs's own runOwner in a
      # tight loop instead, concentrating on the flow that has produced most sightings, and always
      # exits 0 because a crash is the observation rather than a failure. Diagnostic only.
      - name: Run the owner-flow crash loop (ruling 200)
        if: ${{ inputs.loop != '' }}
        env:
          BASE: ${{ steps.target.outputs.url }}
          OUT: ${{ github.workspace }}/matrix-out
          LOOPS: ${{ inputs.loop }}
          ONLY: ${{ inputs.only }}
          THEME: ${{ inputs.theme || 'both' }}
          ARM: ${{ inputs.probe != '' && 'probe' || 'control' }}
          PROBE: ${{ inputs.probe }}
        run: |
          # The shell opens loop.log before node runs, and matrix-out is otherwise created only
          # once tests/matrix.cjs loads, so without this tee fails to open the file, streams to
          # stdout anyway and exits non-zero, failing a step whose loop actually succeeded.
          mkdir -p "$OUT"
          ulimit -c unlimited
          node tests/webkit-crash-loop.cjs 2>&1 | tee "$OUT/loop.log"
          echo "### ruling 200 loop" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(ruling 200 loop|RESULT|LOOP .*CRASHED)' "$OUT/loop.log" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Run matrix
        if: ${{ inputs.loop == '' }}
        env:
          BASE: ${{ steps.target.outputs.url }}
          WEBKIT: "1"
          ENGINE: ${{ inputs.engine }}
          OUT: ${{ github.workspace }}/matrix-out
          # Empty is falsy in tests/matrix.cjs, so an unset input runs the whole matrix.
          SPECIAL: ${{ inputs.special }}
          ONLY: ${{ inputs.only }}
          THEME: ${{ inputs.theme }}
          EXPECT: ${{ inputs.expect }}
          # Ruling 292: EXPECT=write only ever gives the number. This names the checks behind it, which
          # is what makes a changed count explainable by arm group rather than merely different.
          DUMP_LABELS: ${{ inputs.dump_labels }}
          RULING200_PROBE: ${{ inputs.probe }}
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          ulimit -c unlimited
          node tests/matrix.cjs 2>&1 | tee "$OUT/matrix.log"
      - name: Extract the signal and stack from any core (ruling 200)
        if: always()
        # As on the PR path: diagnostic by charter, so it cannot fail the job by construction.
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob
          cores=(/tmp/cores/core.*)
          echo "cores written: ${#cores[@]}"
          [ "${#cores[@]}" -eq 0 ] && exit 0
          # Ruling 850. continue-on-error is right under 217 and it also buys silence: this step can
          # now degrade three ways and every one of them is quiet. apt failing prints a ::notice::
          # that nobody reads in a job that went green; an unresolvable executable and a gdb run that
          # produces no frames each leave one line in an artefact nobody opens. The next PR-path
          # crash is the one that finally delivers frames and offsets, because run 259's step died
          # before gdb ran and run 260 had nothing to analyse, and a degradation that announces
          # nothing would lose exactly that crash without anyone knowing it was lost. So a degraded
          # extraction says so in the job summary, where the classification tail already reports.
          degraded() {
            echo "::warning::ruling 850: the core extraction degraded, $1"
            {
              echo "### ruling 850: a web process died and its stack was NOT extracted"
              echo ""
              echo "$1"
              echo ""
              echo "Nothing else in this run captures those frames. Where the core was retained it is"
              echo "in this job's artefact under \`cores/\`; where it was not, the crash is unrecoverable."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          # Ruling 217: this step is diagnostic by its own charter, and apt and gdb are third
          # parties it does not test. It reports what it found and never fails the job; a red gate
          # here would be red for a reason unrelated to anything the matrix asserts.
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb elfutils || {
            degraded "gdb and elfutils could not be installed, so ${#cores[@]} core(s) are retained unanalysed."
            mkdir -p "$OUT/cores"
            for c in "${cores[@]}"; do cp "$c" "$OUT/cores/" 2>/dev/null || true; done
            exit 0
          }
          mkdir -p "$OUT/cores"
          for c in "${cores[@]}"; do
            name=$(basename "$c")
            echo "=== $name ===" | tee -a "$OUT/cores/stacks.txt"
            file "$c" | tee -a "$OUT/cores/stacks.txt"
            # `file` names the binary in execfn; that is the only reliable source here, because the
            # crashing thread's comm (ThreadedCompositor, truncated to 15 chars) is what %e records,
            # not the executable. Passing the core with no executable makes gdb read it as one.
            # `|| true` is load-bearing, not tidiness. The runner's default shell is `bash -e`, so
            # -e is already on before this step's own `set -uo pipefail`, and grep exits 1 when it
            # matches nothing. A core `file` cannot read the notes of prints no `execfn:` at all, so
            # the pipeline exits 1, the assignment inherits it, and the step dies before gdb runs:
            # on run 259 the first real core on this path read "too many program headers (2054)" and
            # took the whole job red with it, which is exactly the diagnostic-fails-the-gate shape
            # this step's charter forbids. Empty is a legitimate answer here and reaches the
            # degraded path below, which retains the core for offline analysis.
            exe=$(file "$c" | grep -o "execfn: '[^']*'" | head -1 | sed "s/execfn: '//; s/'$//" || true)
            [ -n "$exe" ] || exe=$(file "$c" | grep -o "from '[^']*'" | head -1 | sed "s/from '//; s/'$//" | awk '{print $1}' || true)
            echo "exe: ${exe:-unknown}" | tee -a "$OUT/cores/stacks.txt"
            frames=0
            if [ -n "$exe" ] && [ -e "$exe" ]; then
              # info sharedlibrary is what makes the frames portable: without debug info the
              # addresses mean nothing on their own, but library-relative offsets anchor to an
              # exact build that someone with symbols can map.
              # `bt` on the current thread comes first and is what matters: in a core gdb positions
              # itself on the thread that faulted, and `thread apply all` prints threads in
              # descending order, so the faulting thread is last and a truncating `head` eats
              # exactly the frames worth having. That is how run 38's stack was lost.
              gdb -batch -q -ex "set pagination off" -ex "info registers rip" \
                -ex "info sharedlibrary" -ex "echo \n=== FAULTING THREAD ===\n" -ex "bt 60" \
                -ex "echo \n=== ALL THREADS ===\n" -ex "thread apply all bt 25" \
                "$exe" --core "$c" 2>&1 |
                head -4000 | tee -a "$OUT/cores/gdb-$name.txt"
              cat "$OUT/cores/gdb-$name.txt" >> "$OUT/cores/stacks.txt"
              grep -qE '^#[0-9]+ ' "$OUT/cores/gdb-$name.txt" && frames=1
              if [ "$frames" -eq 1 ]; then
                wk=$(grep -o '/[^ ]*libWPEWebKit[^ ]*' "$OUT/cores/gdb-$name.txt" | head -1 || true)
                [ -n "$wk" ] && file "$wk" > "$OUT/cores/buildid-$name.txt" 2>/dev/null || true
                node scripts/frame-offsets.mjs "$OUT/cores/gdb-$name.txt" \
                  "$OUT/cores/buildid-$name.txt" > "$OUT/cores/offsets-$name.txt" 2>&1 || true
                # Print the faulting thread's offsets in full; the all-threads dump stays in the
                # artifact. Printing the tail would again show the least interesting threads.
                sed -n '1,80p' "$OUT/cores/offsets-$name.txt"
              fi
            else
              echo "executable not resolvable" | tee -a "$OUT/cores/stacks.txt"
              degraded "the executable could not be resolved from \`file\` output for $name, so gdb was never run."
            fi
            # A web-process core runs to hundreds of megabytes or more, and an artifact that fails
            # to upload takes the stack down with it. Keep the core only when no frames came back,
            # which is the only case where it is still worth analysing offline.
            if [ "$frames" -eq 1 ]; then
              echo "frames extracted; core not retained ($(du -h "$c" | cut -f1))" | tee -a "$OUT/cores/stacks.txt"
            else
              echo "no frames; retaining core ($(du -h "$c" | cut -f1))" | tee -a "$OUT/cores/stacks.txt"
              degraded "gdb ran on $name but returned no frames."
              cp "$c" "$OUT/cores/" 2>/dev/null || {
                echo "core copy failed (size?)" | tee -a "$OUT/cores/stacks.txt"
                degraded "$name could not be copied into the artefact either, so it is lost with the runner."
              }
            fi
          done
          exit 0
        env:
          OUT: ${{ github.workspace }}/matrix-out
      # Rulings 267, 274 and 292: the per-arm accounting, the result per tier and whether a failure
      # sat behind a crash, readable in the tail without fetching the log.
      #
      # Last of the reporting steps on purpose. It used to run before the core extraction above,
      # and on the one kind of run where the classification matters most, a run that lost a web
      # process, that step then printed up to 4000 lines of gdb frames after it and buried the
      # summary again. Run 45 is where that showed: ruling 267's own defect, reintroduced one step
      # further down the job.
      - name: Arms, tiers and the crash classification, in the tail
        if: always()
        env:
          OUT: ${{ github.workspace }}/matrix-out
        run: |
          set -uo pipefail
          log="$OUT/matrix.log"
          if [ ! -s "$log" ]; then
            echo "The matrix step produced no output; it did not reach tests/matrix.cjs."
            exit 0
          fi
          tail=$(sed -n '/=== arms by tier/,$p' "$log")
          [ -n "$tail" ] || tail=$(tail -80 "$log")
          echo "=== the matrix summary, re-emitted (ruling 267) ==="
          printf '%s\n' "$tail"
          {
            echo "### matrix (ruling 292: arms, not a total)"
            echo '```'
            printf '%s\n' "$tail"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ steps.target.outputs.slug }}-${{ github.run_number }}
          path: matrix-out
          if-no-files-found: warn
